spring:
  application:
    name: order-management-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5432}}/${POSTGRES_DB:order_management}
    username: ${POSTGRES_USER:order_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: OPENAPI_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    validator-url: none
    persist-authorization: false
  paths-to-match: /api/**
  override-with-generic-response: false
management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: order-management-api
    audience: order-management-api
    access-token-ttl: 15m
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
