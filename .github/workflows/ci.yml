name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Docker availability for PostgreSQL Testcontainers
        run: docker info > /dev/null
      - name: Unit, MVC, security, PostgreSQL, OpenAPI, clean install and V1-V6 upgrades
        run: ./mvnw -B -ntp verify -Pintegration
